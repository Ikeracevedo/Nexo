[project]
name = "nexo"
version = "0.1.0"
description = "Asistente que unifica pendientes dispersos de Microsoft 365 y los devuelve con su origen"
requires-python = ">=3.12"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
show_error_codes = true
disallow_untyped_defs = true
no_implicit_optional = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = "microsoft_teams.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "msgraph.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "kiota_abstractions.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "kiota_authentication_azure.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "azure.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "pymongo.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "google.*"
ignore_missing_imports = true
follow_imports = "skip"

# `microsoft_teams.api` reexporta sus modelos desde submodulos de una forma
# que mypy no resuelve (los ve como atributos inexistentes). Es un defecto de
# empaquetado del SDK, no del codigo: en tiempo de ejecucion los imports
# funcionan. Se silencia SOLO ese codigo de error, y SOLO en el modulo que
# toca el SDK. No se desactiva `attr-defined` en ningun otro sitio.
[[tool.mypy.overrides]]
module = "app.bot.bot_teams"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "app.bot.bot_teams"
disallow_untyped_decorators = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"app/api/pagina_inicio.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
