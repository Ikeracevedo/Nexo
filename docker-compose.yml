services:
  app:
    image: ghcr.io/ikeracevedo/brujula-teams:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
  worker:
    image: ghcr.io/ikeracevedo/brujula-teams:latest
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    healthcheck:
      disable: true
